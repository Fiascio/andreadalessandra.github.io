<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag - Blog di Andrea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="barra-arancio">
    <div class="interno">Blog personale su 3D, game, fumetti e film</div>
  </div>

  <header class="header">
    <div class="interno">
      <a class="logo" href="index.html"><span class="logo-icona"></span>BLOG DI ANDREA</a>
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="tag.html" class="attivo">Tag</a>
        <a href="https://www.artstation.com/fiascio" target="_blank" rel="noopener">Portfolio</a>
      </nav>
    </div>
  </header>

  <div class="pagina">
    <div class="contenitore">

      <main class="colonna-centrale">

        <section class="box">
          <h2 class="box-titolo">Tutti i tag</h2>
          <div class="box-corpo">
            <div id="tag-grandi" class="chips grandi"></div>
          </div>
        </section>

        <section class="box">
          <h2 id="titolo-risultati" class="box-titolo">Articoli</h2>
          <div id="risultati" class="lista"></div>
        </section>

      </main>

      <aside class="colonna-destra">

        <section class="box-laterale">
          <form class="ricerca" action="tag.html" method="get">
            <input type="text" name="q" id="cerca-testo" placeholder="Cerca negli articoli" aria-label="Cerca negli articoli">
            <button type="submit" class="bottone-blu piccolo">Cerca</button>
          </form>
        </section>

        <section class="box-laterale">
          <h2 class="box-titolo">Cerca per tag</h2>
          <div class="box-corpo">
            <form class="ricerca" action="tag.html" method="get">
              <input type="text" id="cerca-tag" name="tag" placeholder="Scrivi un tag (es. 3d)" aria-label="Cerca un tag" autocomplete="off">
              <button type="submit" class="bottone-blu piccolo">Vai</button>
            </form>
            <div id="tag-lista" class="chips"></div>
          </div>
        </section>

        <section class="box-laterale">
          <h2 class="box-titolo">In evidenza</h2>
          <div class="box-corpo vuoto"></div>
        </section>

        <section class="box-laterale">
          <h2 class="box-titolo">Ultime novità</h2>
          <div class="box-corpo vuoto"></div>
        </section>

        <section class="box-laterale">
          <h2 class="box-titolo">Archivio</h2>
          <div class="box-corpo vuoto"></div>
        </section>

        <section class="box-laterale">
          <h2 class="box-titolo">Link utili</h2>
          <div class="box-corpo vuoto"></div>
        </section>

      </aside>
    </div>
  </div>

  <footer class="footer">
    <div class="interno">&copy; 2026 Blog di Andrea. Tutti i marchi sono di proprietà dei rispettivi titolari.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
